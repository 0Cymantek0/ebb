ShortDescription: Effortless, safe disk-space reclamation for development workspaces.
Description: >-
  Ebb reclaims disk space in development workspaces without losing anything
  that matters. Verified trims remove regenerable build output while .env
  files, private notes and other non-reconstructible files are preserved by
  default. Workspaces can be parked into an encrypted restic vault and
  restored later with independent verification. Fully offline, zero telemetry.
